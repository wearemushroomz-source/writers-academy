<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Writers’ Academy</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14301f;
    color: #f5ecd7;
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    border: 2px solid #c9a24a;
    border-radius: 12px;
    padding: 32px 24px;
    max-width: 420px;
    background: #0f2518;
  }
  h1 { color: #c9a24a; font-size: 2rem; margin: 0 0 8px; }
  p { font-size: 1.1rem; line-height: 1.6; }
  .motto { color: #b04a5a; font-style: italic; }
</style>
</head>
<body>
  <div class="card">
    <h1>The Writers’ Academy</h1>
    <p>School of Creative Writing &amp; Literature</p>
    <p class="motto">Welcome, student. Your studies begin soon.</p>
  </div>
</body>
</html>
